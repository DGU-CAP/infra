apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../base/backend
- externalsecret.yaml

# 이미지 태그는 CI가 커밋 SHA로 교체: kustomize edit set image <name>=<name>:<git-sha>
images:
- name: 428185450315.dkr.ecr.ap-northeast-2.amazonaws.com/dgu-cap-backend
  newName: 428185450315.dkr.ecr.ap-northeast-2.amazonaws.com/dgu-cap-backend
  newTag: e15dd4bbb39a271af5388d78e9f691d1f3716b4e

patches:
- path: patch.yaml
  target:
    kind: Deployment
    name: backend
