apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai
spec:
  serviceName: ai
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai
          image: 428185450315.dkr.ecr.ap-northeast-2.amazonaws.com/dgu-cap-ai:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: ai-secret
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: model-storage
              mountPath: /code/models
  volumeClaimTemplates:
    - metadata:
        name: model-storage
        labels:
          app: ai # SnapshotSchedule claimSelector가 이 라벨로 PVC를 찾음
      spec:
        accessModes:
          - ReadWriteOnce
        # storageClassName 생략 → 기본 SC (kind=standard). EKS는 overlay에서 gp3-retain으로 지정.
        resources:
          requests:
            storage: 10Gi
